app:
  description: 使用自定义扩展实现的食物推荐器，使用前需要先把扩展服务启动。
  icon: watermelon
  icon_background: '#FFEAD5'
  mode: chat
  name: 食物推荐器
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.8@f21552fa7132a760e81ba58a585e7f42edd408ba37a5d5d6669e43886007e362
kind: app
model_config:
  agent_mode:
    enabled: false
    max_iteration: 5
    strategy: react
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    reranking_enable: false
    retrieval_model: multiple
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
    - .JPG
    - .JPEG
    - .PNG
    - .GIF
    - .WEBP
    - .SVG
    - .MP4
    - .MOV
    - .MPEG
    - .MPGA
    allowed_file_types: []
    allowed_file_upload_methods:
    - remote_url
    - local_file
    enabled: false
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
    number_limits: 3
  model:
    completion_params:
      stop: []
    mode: chat
    name: deepseek-v3
    provider: langgenius/openai_api_compatible/openai_api_compatible
  more_like_this:
    enabled: false
  opening_statement: ''
  pre_prompt: 请根据 {{food_list}} 中提供的内容与用户 {{choice}}，提供今日的推荐食谱。
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form:
  - external_data_tool:
      config:
        api_based_extension_id: 651a9eef-2789-41fc-a95d-3bb72fd82742
      label: 测试扩展
      required: true
      type: api
      variable: food_list
  - select:
      default: ''
      label: 食物类型
      options:
      - foods
      - drinks
      required: true
      variable: choice
version: 0.1.5
